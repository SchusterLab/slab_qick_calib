[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slab_qick_calib"
version = "0.1.0"
description = "Qubit calibration tools for QICK"
readme = "README.md"
requires-python = ">=3.6"
license = {text = "MIT"}
authors = [
    {name = "SchusterLab", email = "circuitqed@gmail.com"}
]
dependencies = [
    "numpy",
    "scipy",
    "seaborn", 
    "matplotlib",
    "qick",
    "pyyaml",
    "tqdm",
    "h5py",
    "Pyro4",
    "ipywidgets==7.7.2",
    "visdom",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/SchusterLab/slab_qick_calib"
"Bug Tracker" = "https://github.com/SchusterLab/slab_qick_calib/issues"

[tool.setuptools]
packages = ["slab_qick_calib", "slab_qick_calib.analysis", "slab_qick_calib.calib", "slab_qick_calib.exp_handling", "slab_qick_calib.experiments", "slab_qick_calib.experiments.general", "slab_qick_calib.experiments.single_qubit", "slab_qick_calib.experiments.two_qubit", "slab_qick_calib.helpers"]

[tool.setuptools.package-dir]
"slab_qick_calib" = "."
